<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1736"/>
      <stop offset="50%" stop-color="#092552"/>
      <stop offset="100%" stop-color="#051226"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.6" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.9"/>

  <!-- Centered Scaled Group for 100% full view inside all Android / iOS / Desktop app masks -->
  <g transform="translate(46, 36) scale(0.82)">
    <!-- Golden King Crown on Top -->
    <g transform="translate(186, 15)" filter="url(#shadow)">
      <path d="M 0 55 L 25 15 L 70 45 L 115 15 L 140 55 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
      <rect x="0" y="55" width="140" height="18" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
      <circle cx="25" cy="15" r="7" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
      <circle cx="70" cy="45" r="8" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
      <circle cx="115" cy="15" r="7" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
      <circle cx="70" cy="64" r="5" fill="#ef4444"/>
      <circle cx="35" cy="64" r="4" fill="#3b82f6"/>
      <circle cx="105" cy="64" r="4" fill="#22c55e"/>
    </g>

    <!-- 4 Colored Ludo Quadrants Board with 3D Center Dice -->
    <g transform="translate(106, 115)" filter="url(#shadow)">
      <!-- Board Outer Frame -->
      <rect x="0" y="0" width="300" height="300" rx="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="6"/>
      
      <!-- Red Corner (Top-Left) -->
      <path d="M 0 44 A 44 44 0 0 1 44 0 L 150 0 L 150 150 L 0 150 Z" fill="url(#redGrad)"/>
      <circle cx="75" cy="75" r="26" fill="#ffffff"/>
      <circle cx="75" cy="75" r="15" fill="#b91c1c"/>

      <!-- Green Corner (Top-Right) -->
      <path d="M 150 0 L 256 0 A 44 44 0 0 1 300 44 L 300 150 L 150 150 Z" fill="url(#greenGrad)"/>
      <circle cx="225" cy="75" r="26" fill="#ffffff"/>
      <circle cx="225" cy="75" r="15" fill="#15803d"/>

      <!-- Blue Corner (Bottom-Left) -->
      <path d="M 0 150 L 150 150 L 150 300 L 44 300 A 44 44 0 0 1 0 256 Z" fill="url(#blueGrad)"/>
      <circle cx="75" cy="225" r="26" fill="#ffffff"/>
      <circle cx="75" cy="225" r="15" fill="#1d4ed8"/>

      <!-- Yellow Corner (Bottom-Right) -->
      <path d="M 150 150 L 300 150 L 300 256 A 44 44 0 0 1 256 300 L 150 300 Z" fill="url(#yellowGrad)"/>
      <circle cx="225" cy="225" r="26" fill="#ffffff"/>
      <circle cx="225" cy="225" r="15" fill="#a16207"/>

      <!-- Center 3D Dice with 6 Red Dots -->
      <rect x="90" y="90" width="120" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" filter="url(#shadow)"/>
      <circle cx="115" cy="115" r="9" fill="#dc2626"/>
      <circle cx="115" cy="150" r="9" fill="#dc2626"/>
      <circle cx="115" cy="185" r="9" fill="#dc2626"/>
      <circle cx="185" cy="115" r="9" fill="#dc2626"/>
      <circle cx="185" cy="150" r="9" fill="#dc2626"/>
      <circle cx="185" cy="185" r="9" fill="#dc2626"/>
    </g>

    <!-- Text Badge at Bottom -->
    <g transform="translate(136, 432)" filter="url(#shadow)">
      <rect x="0" y="0" width="240" height="50" rx="25" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
      <text x="120" y="33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#0b1736" text-anchor="middle" letter-spacing="2">LUDO KING</text>
    </g>
  </g>
</svg>
